name: Check release sources
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  source-and-summary-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -c "import reproduce; reproduce.verify(False)"
      - run: python tools/check_summary.py
